use_default_settings:
  engines:
    keep_only:
      - bing
      - google
      - naver

general:
  debug: false
  instance_name: Concert Passport Discovery
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - json

server:
  secret_key: overridden-by-SEARXNG_SECRET
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 24
  pool_maxsize: 12

engines:
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: naver
    disabled: false
