<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Concert Passport · 总有一场现场，值得你出发。</title>
  <desc id="desc">原创品牌插画：墨绿背景、荧光绿巡演路线与一张代表私人现场档案的抽象票根。这不是产品截图或真实演出票。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101e19"/><stop offset="1" stop-color="#233c30"/>
    </linearGradient>
    <radialGradient id="light"><stop stop-color="#d5ff70" stop-opacity=".12"/><stop offset="1" stop-color="#d5ff70" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#e9f0df" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1600" height="640" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="640" rx="24" fill="url(#grid)"/>
  <ellipse cx="1270" cy="340" rx="430" ry="390" fill="url(#light)"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <circle cx="88" cy="69" r="20" fill="#f5f4eb"/>
    <path d="M71 71c5 0 7-10 12-10s6 15 12 15 7-10 15-10" fill="none" stroke="#182920" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="110" cy="66" r="4" fill="#d5ff70"/>
    <text x="130" y="76" font-size="20" font-weight="700" letter-spacing="3" fill="#f5f4eb">CONCERT PASSPORT</text>
    <text x="1500" y="76" text-anchor="end" font-size="13" letter-spacing="3" fill="#a8bbaa">OPEN SOURCE / APAC</text>
    <text x="70" y="192" font-size="15" letter-spacing="4" fill="#d5ff70">FIND THE SHOW. KEEP THE NIGHT.</text>
    <text x="64" y="290" font-size="78" font-weight="700" letter-spacing="-3" fill="#f5f4eb">总有一场现场，</text>
    <text x="64" y="387" font-size="78" font-weight="700" letter-spacing="-3" fill="#d5ff70">值得你出发。</text>
    <text x="70" y="451" font-size="22" fill="#bac9bb">找到下一场 · 核对官方信息 · 把回忆盖进护照</text>
    <path d="M70 541H775" stroke="#617766" stroke-opacity=".5"/>
    <text x="70" y="580" font-size="12" letter-spacing="2" fill="#a8bbaa">01 DISCOVER</text>
    <text x="307" y="580" font-size="12" letter-spacing="2" fill="#a8bbaa">02 SAVE</text>
    <text x="515" y="580" font-size="12" letter-spacing="2" fill="#a8bbaa">03 REMEMBER</text>
    <path d="M847 169C1015 79 1246 126 1373 230S1392 470 1225 499 1012 418 990 318" fill="none" stroke="#d5ff70" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 8"/>
    <circle cx="896" cy="147" r="7" fill="#d5ff70"/><circle cx="1373" cy="230" r="7" fill="#d5ff70"/><circle cx="1225" cy="499" r="7" fill="#d5ff70"/>
    <text x="863" y="119" font-size="12" letter-spacing="2" fill="#c4d5bb">SEOUL</text>
    <text x="1397" y="233" font-size="12" letter-spacing="2" fill="#c4d5bb">TAIPEI</text>
    <text x="1190" y="532" font-size="12" letter-spacing="2" fill="#c4d5bb">SINGAPORE</text>
    <g transform="translate(1000 194) rotate(-10 200 136)">
      <rect x="8" y="12" width="400" height="272" rx="14" fill="#050e09" opacity=".32"/>
      <path d="M14 0H386a14 14 0 0 1 14 14v109a13 13 0 0 0 0 26v109a14 14 0 0 1-14 14H14a14 14 0 0 1-14-14V149a13 13 0 0 0 0-26V14A14 14 0 0 1 14 0Z" fill="#f5f4eb"/>
      <text x="30" y="40" font-size="11" letter-spacing="2" fill="#54715b">PERSONAL LIVE ARCHIVE</text>
      <text x="30" y="92" font-size="38" font-weight="700" letter-spacing="-1" fill="#203a2c">I WAS THERE.</text>
      <text x="30" y="121" font-size="13" fill="#54715b">每一场，都有自己的故事。</text>
      <path d="M24 158H376" stroke="#b4b9a6" stroke-dasharray="4 5"/>
      <g transform="translate(315 205) rotate(-12)" fill="none" stroke="#987d58">
        <circle r="42" stroke-width="1.5"/><circle r="36" stroke-width=".7"/>
        <text y="5" text-anchor="middle" font-size="19" font-weight="700" fill="#987d58" stroke="none">APAC</text>
      </g>
      <text x="30" y="192" font-size="10" letter-spacing="2" fill="#54715b">A NIGHT WORTH KEEPING</text>
      <path d="M31 213v30m5-30v30m6-30v30m3-30v30m7-30v30m4-30v30m9-30v30m3-30v30m6-30v30m5-30v30m9-30v30m3-30v30m8-30v30m5-30v30m4-30v30m8-30v30m3-30v30m7-30v30m4-30v30m8-30v30m5-30v30" stroke="#203a2c" stroke-width="2"/>
    </g>
  </g>
</svg>
